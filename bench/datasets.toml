# Benchmark dataset registry (Week 4). Every OpenML dataset the benchmark uses.
#
# - md5 is OpenML's checksum of its ARFF file (provenance only); the parquet file the loader
#   uses is pinned by sha256, verified on every load (bench/data/openml.py).
# - Files are downloaded once to ~/.holdout/datasets/<id>-v<version>.pq and then used offline.
# - Pools are disjoint (tests/unit/bench/test_data_registry.py):
#     dev        - threshold and prompt tuning, the dev suite, the pilot;
#     final      - bases for the frozen planted-trap suite;
#     real_world - the real-world suite (external ground truth); never a trap base.
# - Base screen for dev/final (system-independent, applied before any system ran on them):
#   binary classification or regression, under 1% exact duplicate feature rows, not known to
#   be time-ordered. Excluded after screening: spambase (8.6% duplicates), kc1 (43%), pc4
#   (7.9%), blood-transfusion (33%), wine_quality (18%), ilpd (2.2%), PhishingWebsites (48%),
#   nomao (7.0%), banknote-authentication (1.8%), ozone-level-8hr (a daily time series).
# - Dev/final bases drop their remaining exact duplicate feature rows and are shuffled with
#   a base-specific seed: many OpenML files are sorted by class (lag-1 autocorrelation of
#   the target in file order: MagicTelescope z=125, spambase 82, wilt 55, qsar-biodeg 29,
#   credit-approval 21), and the planted trap must be the only structure in a trap base.
#   Real-world datasets are used exactly as distributed (their order is part of the case).
# - Large datasets are subsampled to at most 50,000 rows, deterministically (see each entry).
[[dataset]]
name = "adult"
openml_id = 1590
version = 2
pool = "dev"
target = "class"
task = "classification"
licence = "Public"
rows = 48842
md5 = "bb6510925e5d4b23d136715febb2cdf5"
sha256 = "01f7570bc4c800d473e9381615e6a5b0eca53900196bbf9f751439545c909263"
parquet_url = "https://data.openml.org/datasets/0000/1590/dataset_1590.pq"
deduplicate = true
shuffle_seed = 1590

