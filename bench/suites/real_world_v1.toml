# ----------------------------------------------------------------------------- not included

# - phoneme (OpenML 1489) was proposed as a clean control and dropped: its documentation
#   says the 5,404 rows are 'vowels coming from 1809 isolated syllables', so several rows
#   come from one syllable and recording, a dependence no system can test (no syllable id).
# - Covertype was kept: OpenML 150 is the MOA-normalised version (description: 'Normalized
#   version ... Source: MOA, Albert Bifet'), and its file order carries the documented
#   dependence (target lag-1 z = 906 in file order).
# - Bank Marketing's date ordering is included as a secondary issue: UCI's names file
#   states it ('ordered by date (from May 2008 to November 2010)').
