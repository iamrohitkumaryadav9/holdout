[[case.issue]]
id = "temporal_dependence"
categories = ["time_leakage"]
min_severity = "warning"
columns = []
remediation = "split:time:<row>"
scored = true
citation_url = "https://arxiv.org/abs/1301.3524"
citation = "Zliobaite (2013), How good is the Electricity benchmark for evaluating concept drift adaptation, arXiv:1301.3524"
summary = "Section 'Testing on the Electricity data': 'the labels are not independent', with 'long consecutive periods of UP'; label autocorrelation peaks every 48 instances; predicting the previous label scores 85.3% against a 57.5% majority baseline. A random split lets a model use neighbouring periods from the future."

[[case]]
id = "covertype_ordered"
dataset = "covertype_moa"
openml_id = 150
openml_version = 3
target = "class"
task = "classification"
kind = "issues"
goal = "Predict the forest cover type of the next cells in the data stream (new locations) from cartographic variables."
anonymised_goal = "Predict target for the next rows in the stream; the model will be used on rows that come after the training data."
note = "The ordering is spatial, not temporal (Souza et al. 2020, Table 1: ordering 'spatial', details 'not provided'). The goal frames deployment as the next cells of the stream, for which a random split leaks neighbouring cells; for an i.i.d. framing it would not be a problem."

[[case.issue]]
id = "order_dependence"
categories = ["time_leakage"]
min_severity = "warning"
columns = []
remediation = "split:time:<row>"
scored = true
citation_url = "https://arxiv.org/abs/2005.00113"
citation = "Souza, dos Reis, Maletzke and Batista (2020), Challenges in Benchmarking Stream Learning Algorithms with Real-world Data, arXiv:2005.00113 (Sections 4.2 and 4.6, Table 1)"
summary = "Section 4.2: Electricity's temporal-dependence problem also affects 'Forest Covertype': 'the data are probably organized according to the geographical location', so 'neighboring regions are of the same class'; a No-Change baseline reaches 95.07% accuracy."

