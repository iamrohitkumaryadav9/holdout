[[case]]
id = "bank_marketing"
dataset = "bank_marketing_additional"
openml_id = 42813
openml_version = 1
target = "y"
task = "classification"
kind = "issues"
goal = "Predict whether a client will subscribe to a term deposit, so the bank can decide whom to call before calling them."
anonymised_goal = "Predict target for a new row before its outcome is known, so the decision can be made in advance."

[[case.issue]]
id = "duration_post_outcome"
categories = ["post_outcome_column", "target_leakage"]
min_severity = "warning"
columns = ["duration"]
remediation = "drop:duration"
scored = true
citation_url = "https://archive.ics.uci.edu/static/public/222/bank+marketing.zip"
citation = "Moro, Rita and Cortez (2014), Bank Marketing, UCI, doi:10.24432/C5K306; file bank-additional/bank-additional-names.txt"
summary = "UCI's names file: 'the duration is not known before a call is performed. Also, after the end of the call y is obviously known. Thus, this input ... should be discarded if the intention is to have a realistic predictive model.'"

[[case.issue]]
id = "ordered_by_date"
categories = ["time_leakage"]
min_severity = "warning"
columns = []
remediation = "split:time:<row>"
scored = true
secondary = true
citation_url = "https://archive.ics.uci.edu/static/public/222/bank+marketing.zip"
citation = "Moro, Rita and Cortez (2014), Bank Marketing, UCI, doi:10.24432/C5K306; file bank-additional/bank-additional-names.txt"
summary = "UCI's names file: 'bank-additional-full.csv with all examples, ordered by date (from May 2008 to November 2010)'; the file has no year column, so time is only in the row order."

