[[case]]
id = "mushroom"
dataset = "mushroom"
openml_id = 24
openml_version = 1
target = "class"
task = "classification"
kind = "clean"
goal = "Predict whether a mushroom is edible or poisonous from its physical characteristics."
anonymised_goal = "Predict target from the characteristics in each row."
citation_url = "https://archive.ics.uci.edu/static/public/73/mushroom.zip"
citation = "Mushroom (1981), UCI, doi:10.24432/C5959T; agaricus-lepiota.names (rules by W. Duch)"
summary = "The known honest near-perfect predictor: 'odor=NOT(almond.OR.anise.OR.none)' alone gives 98.52% accuracy and four simple rules give 100%. Believed clean (our judgement): every attribute is a physical characteristic observable before the label; no identifiers, no time; 0 duplicate feature rows. The file is sorted (target lag-1 z = 44), which is not time."

