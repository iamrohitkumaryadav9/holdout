[[case.issue]]
id = "repeated_patients"
categories = ["group_leakage"]
min_severity = "warning"
columns = ["patient_nbr"]
remediation = "split:group:patient_nbr"
scored = true
citation_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC3996476/"
citation = "Strack et al. (2014), Impact of HbA1c Measurement on Hospital Readmission Rates, BioMed Research International 2014:781670, doi:10.1155/2014/781670"
summary = "Encounters repeat per patient (UCI: patient_nbr is the 'Unique identifier of a patient'); Strack et al. 'considered only the first encounter for each patient' so that observations are independent. For new patients a random split over encounters lets a model memorise patients."

[[case.issue]]
id = "encounter_id_identifier"
categories = ["id_signal"]
min_severity = "info"
columns = ["encounter_id"]
remediation = "drop:encounter_id"
scored = true
citation_url = "https://archive.ics.uci.edu/dataset/296/diabetes+130-us+hospitals+for+years+1999-2008"
citation = "Clore, Cios, DeShazo and Strack (2014), Diabetes 130-US Hospitals for Years 1999-2008, UCI, doi:10.24432/C5230J"
summary = "UCI variable table: encounter_id is the 'Unique identifier of an encounter'. An identifier must not be a feature; detection means recognising it as an identifier (id_signal at any severity), remediation means it is not used."

[[case.issue]]
id = "death_makes_readmission_impossible"
categories = []
min_severity = "info"
columns = ["discharge_disposition_id"]
remediation = ""
scored = false
citation_url = "https://pmc.ncbi.nlm.nih.gov/articles/PMC3996476/"
citation = "Strack et al. (2014), doi:10.1155/2014/781670; code meanings from IDS_mapping.csv in the UCI zip (doi:10.24432/C5230J)"
summary = "IDS_mapping.csv: discharge_disposition_id 11 = 'Expired', 19-21 = 'Expired ... hospice'. Strack et al. 'removed all encounters that resulted in either discharge to a hospice or patient death, to avoid biasing our analysis'. In the data all 1,652 encounters with codes 11, 19 or 20 are 'NO'. A cohort-definition problem, not leakage (the disposition is known at discharge), so no Category fits: documented, not scored."

[[case]]
id = "electricity"
dataset = "electricity"
openml_id = 151
openml_version = 1
target = "class"
task = "classification"
kind = "issues"
goal = "Predict whether the New South Wales electricity price will go up or down, relative to its 24-hour moving average, for future half-hour periods."
