# Real-world suite v1: external ground truth, frozen BEFORE any benchmark system ran on it.
#
# Every scored issue has a citation that was checked against an accessible source on
# 2026-11-18 (the quoted text is in `summary`). Nothing here is inferred from running a
# system. Datasets are in bench/datasets.toml (pool "real_world"), used as distributed.
#
# Scoring (bench/score.py):
# - An issue is DETECTED when a system reports one of `categories` at severity >=
#   `min_severity`. When `columns` is not empty, the report must also name at least one of
#   them. Row-order issues have no column (`columns = []`).
# - `min_severity` is "warning" for every real-world issue: no external source grades how
#   severe these problems are, so detection means "reported as a problem" (warning or
#   critical). Critical-level detection is reported as a secondary metric.
# - `remediation` is what the final pipeline must show for the issue to count as fixed:
#   drop:COL (the column is not used), split:group:COL, split:time:COL, or split:time:<row>
#   (a forward split over the row order).
# - `scored = false` marks a documented issue that no Category fits. It is listed in
#   reports, never scored.
# - `secondary = true` marks a documented issue reported in its own row, outside the primary
#   real-world detection rate.
# - Clean controls: a critical flag (primary) or any flag above info (secondary) is a false
#   alarm. Their "believed clean" reason is our judgement from the documented nature of
#   the rows and attributes, not a claim made by the source.
#
# Each case also runs in an ANONYMISED variant (bench/suites/real_world_v1_anonymised.json):
# columns renamed col_1..col_n in file order, the target renamed "target", and the goal
# replaced by `anonymised_goal`, which keeps the deployment framing without domain words.

schema_version = 1
frozen_on = "2026-11-18"

