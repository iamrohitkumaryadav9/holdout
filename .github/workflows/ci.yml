name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installs from pyproject.toml; requirements.lock is for local reproducibility only.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests scripts bench

      - name: Ruff format
        run: ruff format --check src tests scripts bench

      # Strict on the whole package (a superset of core, data and plan) and the trap bench.
      - name: Mypy (strict)
        run: mypy src/holdout bench

      # Coverage sources and the 85% overall floor are configured in pyproject.toml.
      # Full test tier everywhere; the 50k-row performance tests (marked slow) on Ubuntu only.
      - name: Pytest with coverage (full tier)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then MARKERS=""; else MARKERS="not slow"; fi
          pytest --tier full -m "$MARKERS" --cov --cov-report=term-missing --cov-report=xml

      - name: Audit coverage (>= 90% on holdout/audit)
        run: coverage report --include="*/holdout/audit/*" --fail-under=90

      - name: Agent coverage (>= 90% on holdout/agent)
        run: coverage report --include="*/holdout/agent/*" --fail-under=90

      - name: LLM coverage (>= 90% on holdout/llm)
        run: coverage report --include="*/holdout/llm/*" --fail-under=90

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
